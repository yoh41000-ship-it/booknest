<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книга — BookNest</title>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
</head>
<body>
    <header class="site-header">
        <a href="index.html">BookNest</a>
        <nav class="site-nav" aria-label="Основная навигация">
            <ul>
                <li><a href="index.html">Каталог</a></li>
                <li><a href="loan.html">Выдача</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <nav aria-label="Хлебные крошки">
            <ol>
                <li><a href="index.html">Каталог</a></li>
                <li aria-current="page">Книга</li>
            </ol>
        </nav>

        <p data-role="loading" hidden>Загрузка…</p>

        <div data-role="error" hidden>
            <p data-role="error-text"></p>
            <p><a href="index.html">← Вернуться в каталог</a></p>
        </div>

        <article data-role="book" hidden>
            <h1 data-role="title"></h1>
            <p>Автор: <span data-role="authors"></span></p>
            <p>Год: <span data-role="year"></span></p>
            <p>Описание:</p>
            <p data-role="description"></p>
        </article>
    </main>

    <footer class="site-footer">
        <p>© 2025 BookNest</p>
    </footer>

    <script type="module" src="js/book.js"></script>
</body>
</html>
