<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выдача книги — BookNest</title>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
</head>
<body>
    <header class="site-header">
        <a href="index.html">BookNest</a>
        <nav class="site-nav" aria-label="Основная навигация">
            <ul>
                <li><a href="index.html">Каталог</a></li>
                <li><a href="loan.html" aria-current="page">Выдача</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1>Форма выдачи книги</h1>

        <form class="loan-form" action="/loan" method="post">
            <fieldset class="fieldset">
                <legend>Данные читателя</legend>
                <p class="form-field">
                    <label for="reader-name">ФИО</label>
                    <input type="text" id="reader-name" name="reader_name" required maxlength="100">
                </p>
                <p class="form-field">
                    <label for="reader-email">Email</label>
                    <input type="email" id="reader-email" name="reader_email" required>
                </p>
                <p class="form-field">
                    <label for="reader-card">Номер читательского билета</label>
                    <input type="text" id="reader-card" name="card_number"
                           required pattern="[0-9]{6}" title="Шесть цифр">
                </p>
            </fieldset>

            <fieldset class="fieldset">
                <legend>Данные о выдаче</legend>
                <p class="form-field">
                    <label for="book-id">ID книги</label>
                    <input type="number" id="book-id" name="book_id" required min="1" max="99999">
                </p>
                <p class="form-field">
                    <label for="loan-date">Дата выдачи</label>
                    <input type="date" id="loan-date" name="loan_date" required>
                </p>
                <p class="form-field">
                    <label for="loan-period">Срок выдачи</label>
                    <select id="loan-period" name="period" required>
                        <option value="">— выберите —</option>
                        <option value="7">7 дней</option>
                        <option value="14">14 дней</option>
                        <option value="30">30 дней</option>
                    </select>
                </p>
            </fieldset>

            <fieldset class="fieldset">
                <legend>Дополнительно</legend>
                <p class="form-field">
                    <label for="comment">Комментарий</label>
                    <textarea id="comment" name="comment" maxlength="500" rows="4"></textarea>
                </p>
            </fieldset>

            <button type="submit" class="btn">Оформить выдачу</button>
        </form>
    </main>

    <footer class="site-footer">
        <p>© 2025 BookNest</p>
    </footer>
</body>
</html>
