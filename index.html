<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest — каталог книг</title>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
</head>
<body>
    <header class="site-header">
        <a href="index.html">BookNest</a>
        <nav class="site-nav" aria-label="Основная навигация">
            <ul>
                <li><a href="index.html" aria-current="page">Каталог</a></li>
                <li><a href="loan.html">Выдача</a></li>
            </ul>
        </nav>
        <a href="#wishlist" class="wishlist-link">
            Мой список (<span data-role="wishlist-count">0</span>)
        </a>
    </header>

    <main class="container catalog-layout">
        <h1>Каталог книг</h1>

        <section class="filters" aria-labelledby="filters-heading">
            <h2 id="filters-heading">Фильтры</h2>
            <form id="filters-form" action="#" method="get">
                <p class="form-field">
                    <label for="search">Поиск</label>
                    <input type="search" id="search" name="q" maxlength="100">
                </p>
                <p class="form-field">
                    <label for="genre">Жанр</label>
                    <select id="genre" name="genre"></select>
                </p>
                <p class="form-field">
                    <label for="sort">Сортировка</label>
                    <select id="sort" name="sort">
                        <option value="title">По названию (А–Я)</option>
                        <option value="year">По году (новые)</option>
                        <option value="rating">По рейтингу</option>
                    </select>
                </p>
                <p class="form-field">
                    <input type="checkbox" id="available" name="available">
                    <label for="available">Только доступные</label>
                </p>
                <button type="button" id="reset-btn" class="btn">Сбросить фильтры</button>
            </form>
        </section>

        <section aria-labelledby="results-heading">
            <h2 id="results-heading">
                <span data-role="count">Найдено: 0</span>
            </h2>
            <p data-role="empty" hidden>Ничего не найдено. Попробуйте изменить фильтры.</p>
            <div data-role="catalog" class="catalog-grid"></div>
        </section>

        <section id="wishlist" aria-labelledby="wishlist-heading">
            <h2 id="wishlist-heading">Мой список желаемого</h2>
            <ul data-role="wishlist-list" class="wishlist-list"></ul>
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2025 BookNest</p>
    </footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
