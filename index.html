<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest — каталог книг</title>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
</head>
<body>
    <header class="site-header">
        <a href="index.html">BookNest</a>
        <nav class="site-nav" aria-label="Основная навигация">
            <ul>
                <li><a href="index.html" aria-current="page">Каталог</a></li>
                <li><a href="loan.html">Выдача</a></li>
            </ul>
        </nav>
        <a href="#wishlist" class="wishlist-link">
            Мой список (<span data-role="wishlist-count">0</span>)
        </a>
    </header>

    <main class="container catalog-layout">
        <h1>Каталог книг</h1>

        <section class="filters" aria-labelledby="filters-heading">
            <h2 id="filters-heading">Поиск</h2>
            <p class="form-field">
                <label for="search">Название или автор</label>
                <input type="search" id="search" name="q"
                       placeholder="Введите минимум 2 символа" maxlength="100">
            </p>
        </section>

        <section aria-labelledby="results-heading">
            <h2 id="results-heading">
                <span data-role="count"></span>
            </h2>

            <!-- Состояние: загрузка -->
            <p data-role="loading" hidden>Загрузка…</p>

            <!-- Состояние: пусто -->
            <p data-role="empty" hidden>Ничего не найдено. Попробуйте изменить запрос.</p>

            <!-- Состояние: ошибка -->
            <div data-role="error" hidden>
                <p data-role="error-text"></p>
                <button type="button" data-role="retry" class="btn">Повторить</button>
            </div>

            <!-- Состояние: успех -->
            <div data-role="catalog" class="catalog-grid" hidden></div>

            <nav class="pagination" aria-label="Пагинация">
                <button type="button" data-role="prev" class="btn" disabled>← Назад</button>
                <button type="button" data-role="next" class="btn" disabled>Вперёд →</button>
            </nav>
        </section>

        <section id="wishlist" aria-labelledby="wishlist-heading">
            <h2 id="wishlist-heading">Мой список желаемого</h2>
            <ul data-role="wishlist-list" class="wishlist-list"></ul>
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2025 BookNest</p>
    </footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
